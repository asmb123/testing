services:
  backend:
    build: ./backend
    ports:
      - "8081:8081"
    env_file:
      - ./backend/app/.env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./serviceAccountKey.json:/app/app/serviceAccountKey.json:ro

  doc-ui:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
